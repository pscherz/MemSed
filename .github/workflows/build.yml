name: Build

on:
  push:
  pull_request:
  release:
    types:
      - published

jobs:
  build:
    permissions:
      contents: write

    # For reference when cross-platform support is added:
    # https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
    runs-on: ubuntu-24.04

    steps:
      - name: Install WebUI build tools
        run: sudo apt-get install curl unzip

      - name: Clone repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Test
        run: cargo test --quiet

      - name: Build
        run: cargo build --release --features webui --bin memsed-webui

      - name: Upload commit artifact
        uses: actions/upload-artifact@v4
        with:
          name: memsed
          path: |
            target/release/memsed-webui

      - name: Check for uncommitted changes
        run: |
          git diff --exit-code

      - name: Update release notes
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: python .github/workflow_data/release.py

      - name: Upload release artifact
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body_path: .github/workflow_data/release.md
          files: |
            target/release/memsed-webui
