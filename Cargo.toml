[package]
name = "memsed-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
license = "GPL-3.0-or-later"
description = "Linux process and memory primitives for MemSed"

[lib]
path = "rust/src/lib.rs"

[features]
default = []
webui = ["dep:webui-rs"]

[dependencies]
webui-rs = { git = "https://github.com/webui-dev/rust-webui", branch = "main", optional = true }

[[bin]]
name = "memsed-webui"
path = "rust/src/bin/memsed-webui.rs"
required-features = ["webui"]
